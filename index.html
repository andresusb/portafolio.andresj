<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Andrés J. | 3D Visualization</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="dark-theme">
  
  <div id="custom-cursor"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">ANDRÉS<span>J.</span></div>
      <nav id="main-nav" class="nav">
        <a href="#inicio">Inicio</a>
        <a href="#portafolio">Proyectos</a>
        <a href="#sobre-mi">Sobre mí</a>
        <a href="#contacto" class="nav-cta">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="inicio" class="hero">
      <div class="hero-visual">
        <div class="hero-overlay"></div>
      </div>
      <div class="container hero-content">
        <h1 data-aos="fade-up">PURE<br><span class="text-outline">VISUALS</span></h1>
        <p data-aos="fade-up" data-aos-delay="200">Visualización arquitectónica fotorrealista de próxima generación.</p>
        <div class="hero-btns" data-aos="fade-up" data-aos-delay="400">
          <a href="#portafolio" class="btn-primary">Explorar Galería</a>
        </div>
      </div>
    </section>

    <div class="marquee-section">
      <div class="marquee-wrapper">
        <div class="marquee-content">
          <img src="assets/render1.jpg" alt="Render">
          <img src="assets/render2.jpg" alt="Render">
          <img src="assets/render3.jpg" alt="Render">
          <img src="assets/render4.jpg" alt="Render">
          <img src="assets/render1.jpg" alt="Render">
          <img src="assets/render2.jpg" alt="Render">
        </div>
      </div>
    </div>

    <section id="portafolio" class="projects-section">
      <div class="container">
        <h2 class="section-title">Proyectos <span>Destacados</span></h2>
        <div class="projects-grid">
          <div class="project-card" data-aos="zoom-in-up">
            <div class="project-img">
              <img src="assets/tu-render.jpg" alt="Proyecto">
              <div class="project-info-overlay">
                <h3>Residencia Moderna</h3>
                <p>3ds Max + Corona Renderer</p>
              </div>
            </div>
          </div>
          </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1000, once: true });
    
    // Lógica del cursor 2026
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
  </script>
</body>
</html>
